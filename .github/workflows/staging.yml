name: Fork preview

on:
  push:
    branches: [main, codex/pinned-flow-layouts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'haunteds-house/factoriolab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build -- --base-href="/${{ github.event.repository.name }}/"

      - name: Support direct calculator links
        run: cp dist/factoriolab/browser/index.html dist/factoriolab/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/factoriolab/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
